@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pg:#14100A;--panel:#231B0F;--ink:#FFF6D6;--mute:#BBAA84;--line:#3A2E1A;--edge:#FFE600;--sh:#C25100}}
:root[data-theme="dark"]{--pg:#14100A;--panel:#231B0F;--ink:#FFF6D6;--mute:#BBAA84;--line:#3A2E1A;--edge:#FFE600;--sh:#C25100}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--pg);color:var(--ink);font:14px/1.4 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.hero{background:#FFE600;color:#16110B;border-bottom:3px solid #16110B}
.hero .in{max-width:1280px;margin:0 auto;padding:22px 16px 20px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.logo{width:clamp(190px,24vw,290px);aspect-ratio:461/154;background:#C25100;-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat}
.brand p{margin:12px 0 0;font:800 11px/1 -apple-system,"Segoe UI",sans-serif;letter-spacing:.42em;text-transform:uppercase}
.hr{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stats{display:flex;flex-wrap:wrap;gap:8px}
.stat{display:flex;align-items:center;gap:8px;background:#16110B;color:#FFF6D6;border-radius:999px;padding:6px 14px;font-weight:600}
.stat i{width:10px;height:10px;border-radius:50%;background:var(--s)}
.stat b{font:700 17px Georgia,serif;color:#FFE600}
.btn{border:2px solid var(--edge);background:var(--panel);color:var(--ink);border-radius:10px;padding:8px 14px;font-weight:700;box-shadow:3px 3px 0 var(--sh);transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--sh)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--sh)}
.btn.pri{background:#16110B;color:#FFE600;border-color:#16110B}
.hero .btn.pri{box-shadow:3px 3px 0 #C25100}
.tick{background:#16110B;color:#FFE600;overflow:hidden;white-space:nowrap;padding:9px 0;font:800 12px/1 -apple-system,"Segoe UI",sans-serif;letter-spacing:.3em}
.tk{display:inline-block;animation:tk 45s linear infinite}
.tk span{margin:0 18px}.tk b{color:#FF8A3D}
@keyframes tk{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.tk{animation:none}}
.layout{max-width:1280px;margin:0 auto;padding:22px 12px 26px;display:grid;grid-template-columns:240px minmax(0,1fr);gap:20px;align-items:start}
.side{background:var(--panel);border:2px solid var(--edge);border-radius:20px;padding:14px;box-shadow:6px 6px 0 var(--sh);position:sticky;top:8px}
.lbl{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--mute);font-weight:800;margin:2px 4px 8px}
.fc{width:100%;display:flex;align-items:center;gap:10px;border:2px solid transparent;background:transparent;border-radius:12px;padding:9px 10px;margin-bottom:3px;text-align:left;font-weight:500}
.fc:hover{background:color-mix(in srgb,#C25100 12%,transparent)}
.fc i{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none;border:2px solid var(--edge)}
.fc span{flex:1}.fc em{font-style:normal;font-size:12px;color:var(--mute);font-weight:700}
.fc.on{border-color:var(--edge);background:color-mix(in srgb,#FFE600 40%,var(--panel));font-weight:800;box-shadow:2px 2px 0 var(--sh)}
.fc.add{border:2px dashed #C25100;justify-content:center;font-weight:800;color:#C25100;margin-top:8px}
.key{margin-top:14px;padding-top:12px;border-top:2px dashed var(--line);display:flex;flex-direction:column;gap:7px;align-items:flex-start}
.note{color:var(--mute);font-size:12px;margin-top:12px}
.cal{background:radial-gradient(520px 220px at 100% 0,rgba(194,81,0,.45),transparent 70%),#16110B;border:3px solid var(--edge);border-radius:28px;padding:18px;color:#FFF6D6;box-shadow:9px 9px 0 #C25100}
.ch{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
.ch h2{margin:0;font:700 36px/1 Georgia,serif}
.ch h2 small{display:block;font:800 11px -apple-system,"Segoe UI",sans-serif;letter-spacing:3px;text-transform:uppercase;color:#FFE600;margin-bottom:6px}
.nav{display:flex;gap:8px}
.cal .btn{background:transparent;color:#FFF6D6;border-color:#FFE600;box-shadow:3px 3px 0 #C25100}
.dow,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dow div{text-align:center;padding:6px 0;font-size:12px;font-weight:800;letter-spacing:2px;color:#FFE600}
.cell{min-height:128px;padding:7px;border-radius:14px;background:rgba(255,246,214,.06);border:1px solid rgba(255,246,214,.12);cursor:pointer;display:flex;flex-direction:column;gap:6px}
.cell:hover{border-color:#FFE600;background:rgba(255,246,214,.1)}
.cell.out{opacity:.28}
.cell.today{border-color:#FFE600;box-shadow:inset 0 0 0 1px #FFE600}
.dn{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.dn span{min-width:28px;height:28px;padding:0 6px;border-radius:8px;display:grid;place-items:center;font-weight:600;font-size:13px;color:#E8DDB4}
.dn span.has{background:rgba(255,230,0,.18);border:1px solid rgba(255,230,0,.7);color:#fff}
.cell.today .dn span{background:#FFE600;color:#16110B;border-color:#FFE600;font-weight:800}
.bars{display:flex;gap:3px;min-height:4px;padding-left:2px}
.bars i{width:16px;height:4px;border-radius:3px;background:var(--s)}
.chip{cursor:pointer;border-left:4px solid var(--c);border-radius:8px;padding:5px 7px 6px;background:rgba(255,246,214,.1);border-top:1px solid rgba(255,255,255,.08);border-right:1px solid rgba(255,255,255,.08);border-bottom:1px solid rgba(255,255,255,.08)}
.chip:hover{background:rgba(255,246,214,.2)}
.chip .l1{font-size:11.5px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .l1 b{font-weight:800;color:var(--c)}
.badge{margin-top:4px;display:inline-flex;align-items:center;gap:4px;border:0;border-radius:999px;padding:1px 9px 1px 7px;font-size:10.5px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;background:var(--s);color:#16110B}
.badge i{font-style:normal}
.foot{max-width:1280px;margin:0 auto;padding:0 12px 34px;text-align:center}
.foot span{display:inline-block;border:2px solid var(--edge);border-radius:999px;padding:8px 22px;font-weight:700;color:var(--ink)}
.foot b{color:#C25100}
.ov{position:fixed;inset:0;background:rgba(20,12,3,.62);display:none;align-items:center;justify-content:center;padding:14px;z-index:9}
.ov.show{display:flex}
.modal{background:var(--panel);color:var(--ink);border-radius:20px;width:100%;max-width:480px;max-height:92vh;overflow:auto;padding:20px;border:2px solid var(--edge);border-top:8px solid #C25100;box-shadow:8px 8px 0 var(--sh)}
.modal h2{font:700 22px Georgia,serif;margin:0 0 8px}
label{display:block;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--mute);margin:11px 0 4px;font-weight:800}
input,select,textarea{width:100%;font:inherit;color:inherit;background:color-mix(in srgb,#FFE600 12%,var(--panel));border:1.5px solid var(--line);border-radius:9px;padding:8px 10px}
textarea{min-height:90px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg button{border:2px solid var(--line);background:transparent;border-radius:9px;padding:8px 2px;font-size:12px;font-weight:800}
.seg button.on{border-color:var(--s);background:color-mix(in srgb,var(--s) 38%,var(--panel))}
.sw{display:flex;flex-wrap:wrap;gap:8px}
.sw button{width:30px;height:30px;border-radius:50%;border:3px solid transparent;background:var(--c)}
.sw button.on{border-color:var(--ink)}
.acts{display:flex;gap:8px;margin-top:18px}.acts .sp{flex:1}
.del{color:#d64545!important}
@media (max-width:900px){
 .layout{grid-template-columns:1fr;padding:14px 8px 22px}
 .side{position:static;padding:10px;box-shadow:4px 4px 0 var(--sh)}
 .clients{display:flex;flex-wrap:wrap;gap:6px}.fc{width:auto;margin:0;padding:6px 11px;border-color:var(--line)}.fc em{display:none}
 .key,.note{display:none}
}
@media (max-width:700px){
 .logo{width:170px}.brand p{font-size:9px}
 .cal{padding:10px;border-radius:20px;box-shadow:6px 6px 0 #C25100}.ch h2{font-size:25px}
 .dow,.days{gap:3px}.dow div{font-size:10px;letter-spacing:0}
 .cell{min-height:92px;padding:3px;gap:3px;border-radius:9px}
 .dn span{min-width:22px;height:22px;font-size:11px}.bars i{width:9px}
 .chip{padding:2px 3px 3px;border-left-width:3px}.chip .l1{font-size:9.5px}.chip .l1 span{display:none}
 .badge{font-size:0;padding:0;width:15px;height:15px;justify-content:center;gap:0}.badge i{font-size:10px}
}
</style></head>
<body>
<div class="hero"><div class="in">
 <div class="brand"><div class="logo" role="img" aria-label="Joyin"></div><p>Where your brand takes flight</p></div>
 <div class="hr"><div class="stats" id="stats"></div><button class="btn pri" id="add">+ New post</button></div>
</div></div>
<div class="tick"><div class="tk" id="tk"></div></div>
<div class="layout">
 <aside class="side">
  <div class="lbl">Clients</div>
  <div class="clients" id="filters"></div>
  <div class="key"><div class="lbl" style="margin-left:0">Status key</div><div id="legend" style="display:flex;flex-direction:column;gap:7px;align-items:flex-start"></div></div>
  <div class="note">Click a post to edit it. Click its status badge to move it to the next stage. Click an empty date to add a post. Saves in this browser.</div>
 </aside>
 <main class="cal">
  <div class="ch"><h2 id="mt"></h2><div class="nav"><button class="btn" id="prev" aria-label="Previous month">‹</button><button class="btn" id="tod">Today</button><button class="btn" id="next" aria-label="Next month">›</button></div></div>
  <div class="dow"><div>S</div><div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div></div>
  <div class="days" id="days"></div>
 </main>
</div>
<div class="foot"><span><b>Contact us:</b> joyinmediahouse@gmail.com &nbsp;·&nbsp; joyinmediahouse.com</span></div>
<div class="ov" id="ov"><div class="modal" id="modal"></div></div>
<script>
const ST=["Scheduled","Shot","Edited","Published"];
const SC={Scheduled:"#FFD23F",Shot:"#5BB5F0",Edited:"#B28CFF",Published:"#34D399"};
const IC={Scheduled:"●",Shot:"●",Edited:"●",Published:"✓"};
const PAL=["#5AA9FF","#FF6B6B","#FF7EB6","#2EC4B6","#A78BFA","#FF9F5A","#9AD0EC","#E58BF0"];
const PL=["Instagram","Facebook","YouTube","LinkedIn","WhatsApp"],FM=["Reel","Carousel","Static post","Poster","Story","Video"];
const KP="joyin_house_posts_v3",KC="joyin_house_clients_v3";
let C=[{name:"F Squad",color:"#5AA9FF"},{name:"TVS",color:"#FF6B6B"},{name:"Lakme",color:"#FF7EB6"},{name:"Kazi Kitchen",color:"#2EC4B6"},{name:"Ethosphere",color:"#A78BFA"}];
const S=[
["Kazi Kitchen",6,"Launch teaser: 4 new dishes","Instagram","Poster","Something new is on the grill at Kazi Kitchen 🔥 പുതിയ 4 വിഭവങ്ങൾ, ഒരു വലിയ launch!","Published"],
["Kazi Kitchen",9,"Malaki Tawook sizzle reel","Instagram","Reel","Malaki Tawook – juicy, smoky, fresh from the grill. ഈ weekend try ചെയ്യൂ!","Edited"],
["Kazi Kitchen",11,"Meet the 4 new dishes","Instagram","Carousel","Malaki Tawook • Qishta Dajaj • Laham Mashwi • Creamy Mutton. Swipe ചെയ്ത് favourite തിരഞ്ഞെടുക്കൂ 👉","Shot"],
["Kazi Kitchen",14,"Family dinner story","Facebook","Static post","","Scheduled"],
["Kazi Kitchen",16,"What is Qishta Dajaj?","Instagram","Reel","","Scheduled"],
["Kazi Kitchen",19,"Laham Mashwi on the grill","Instagram","Reel","","Scheduled"],
["Lakme",7,"Meta ad reel 1: 30% off","Instagram","Reel","Your beauty career starts here 💄 Courses from 12 hours to 1 year. 30% OFF + easy loan options.","Published"],
["Lakme",9,"Meta ad reel 2: loan options","Instagram","Reel","Dream big, pay easy. Loan options available at Lakmé Academy Kozhikode.","Edited"],
["Lakme",11,"Student exam reel 1","Instagram","Reel","","Shot"],
["Lakme",13,"Student exam reel 2","Instagram","Reel","","Scheduled"],
["Lakme",15,"Which course is right for you?","Instagram","Carousel","","Scheduled"],
["TVS",8,"Festive season offer","Instagram","Poster","","Published"],
["TVS",10,"3 things to check before buying a bike","Instagram","Reel","","Shot"],
["TVS",12,"Happy customer delivery","Facebook","Static post","","Scheduled"],
["TVS",17,"Free service camp","Facebook","Poster","","Scheduled"],
["F Squad",9,"[Sample] Brand intro","Instagram","Carousel","","Scheduled"],
["F Squad",14,"[Sample] Customer result","Instagram","Static post","","Scheduled"],
["Ethosphere",12,"[Sample] Brand intro","Instagram","Carousel","","Scheduled"],
["Ethosphere",20,"[Sample] Project showcase","Instagram","Reel","","Scheduled"]
];
let P=null;
try{const c=JSON.parse(localStorage.getItem(KC));if(Array.isArray(c)&&c.length)C=c}catch(e){}
try{P=JSON.parse(localStorage.getItem(KP))}catch(e){}
if(!Array.isArray(P))P=S.map((r,i)=>({id:"s"+i,client:r[0],date:"2026-10-"+String(r[1]).padStart(2,"0"),title:r[2],platform:r[3],format:r[4],caption:r[5],status:r[6]}));
const save=()=>{try{localStorage.setItem(KP,JSON.stringify(P));localStorage.setItem(KC,JSON.stringify(C))}catch(e){}};
let view=new Date(2026,9,1),flt="All";
const $=id=>document.getElementById(id);
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const col=n=>(C.find(c=>c.name===n)||{color:"#9DB8AE"}).color;
const short=n=>n.length<=10?n:n.split(" ")[0];
const badge=(s,id)=>`<button class="badge" style="--s:${SC[s]}" ${id?`data-adv="${id}" title="Click to move to the next stage"`:""}><i>${IC[s]}</i>${s}</button>`;
function render(){
 const y=view.getFullYear(),m=view.getMonth(),mk=y+"-"+String(m+1).padStart(2,"0");
 $("mt").innerHTML=`<small>Content calendar${flt==="All"?"":" · "+esc(flt)}</small>${view.toLocaleDateString("en-US",{month:"long"})} ${y}`;
 const inM=P.filter(p=>p.date.startsWith(mk));
 $("filters").innerHTML=["All",...C.map(c=>c.name)].map(n=>`<button class="fc ${flt===n?"on":""}" data-c="${esc(n)}" style="--c:${n==="All"?"var(--or)":col(n)}"><i></i><span>${n==="All"?"All clients":esc(n)}</span><em>${n==="All"?inM.length:inM.filter(p=>p.client===n).length}</em></button>`).join("")+`<button class="fc add" id="addc">+ Add client</button>`;
 const mp=inM.filter(p=>flt==="All"||p.client===flt);
 $("stats").innerHTML=ST.map(s=>`<div class="stat" style="--s:${SC[s]}"><i></i>${s==="Published"?"✓ ":""}${s}<b>${mp.filter(p=>p.status===s).length}</b></div>`).join("");
 $("legend").innerHTML=ST.map(s=>badge(s)).join("");
 const first=new Date(y,m,1),start=new Date(y,m,1-first.getDay()),today=iso(new Date());
 let h="";
 for(let i=0;i<42;i++){
  const d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i),k=iso(d);
  if(i>=35&&d.getMonth()!==m)break;
  const ps=P.filter(p=>p.date===k&&(flt==="All"||p.client===flt));
  h+=`<div class="cell ${d.getMonth()!==m?"out":""} ${k===today?"today":""}" data-d="${k}"><div class="dn"><span class="${ps.length?"has":""}">${d.getDate()}</span><div class="bars">${ps.map(p=>`<i style="--s:${SC[p.status]}"></i>`).join("")}</div></div>`+
  ps.map(p=>`<div class="chip" role="button" tabindex="0" data-id="${p.id}" style="--c:${col(p.client)}" title="${esc(p.client)} · ${esc(p.title)} · ${p.status}"><div class="l1"><b>${esc(short(p.client))}</b> <span>${esc(p.title)}</span></div>${badge(p.status,p.id)}</div>`).join("")+`</div>`;
 }
 $("days").innerHTML=h;
}
const opt=(a,v)=>a.map(x=>`<option ${x===v?"selected":""}>${esc(x)}</option>`).join("");
function openEd(id,date){
 const p=id?P.find(x=>x.id===id):{id:"n"+Date.now(),client:flt==="All"?C[0].name:flt,date:date||iso(view),title:"",platform:"Instagram",format:"Reel",caption:"",status:"Scheduled",isNew:true};
 $("modal").innerHTML=`<h2>${p.isNew?"New post":"Edit post"}</h2>
 <label>Client</label><select id="f_c">${opt(C.map(c=>c.name),p.client)}</select>
 <label>Title / idea</label><input id="f_t" value="${esc(p.title)}" placeholder="e.g. Malaki Tawook sizzle reel">
 <div class="row2"><div><label>Date</label><input type="date" id="f_d" value="${p.date}"></div><div><label>Platform</label><select id="f_p">${opt(PL,p.platform)}</select></div></div>
 <label>Format</label><select id="f_f">${opt(FM,p.format)}</select>
 <label>Caption</label><textarea id="f_cap">${esc(p.caption)}</textarea>
 <label>Stage</label><div class="seg" id="seg">${ST.map(s=>`<button data-s="${s}" style="--s:${SC[s]}" class="${p.status===s?"on":""}">${s==="Published"?"✓ ":""}${s}</button>`).join("")}</div>
 <div class="acts">${p.isNew?"":`<button class="btn del" id="del">Delete</button>`}<span class="sp"></span><button class="btn" id="cx">Cancel</button><button class="btn pri" id="sv">Save</button></div>`;
 let st=p.status;
 $("seg").onclick=e=>{const b=e.target.closest("button");if(!b)return;st=b.dataset.s;[...$("seg").children].forEach(x=>x.classList.toggle("on",x===b))};
 $("cx").onclick=close;
 $("sv").onclick=()=>{
  Object.assign(p,{client:$("f_c").value,title:$("f_t").value.trim()||"Untitled post",date:$("f_d").value||p.date,platform:$("f_p").value,format:$("f_f").value,caption:$("f_cap").value,status:st});
  if(p.isNew){delete p.isNew;P.push(p)}
  save();close();view=new Date(p.date+"T00:00:00");view.setDate(1);render();
 };
 if($("del"))$("del").onclick=()=>{P=P.filter(x=>x.id!==p.id);save();close();render()};
 $("ov").classList.add("show");
}
function openClient(){
 let cc=PAL[C.length%PAL.length];
 $("modal").innerHTML=`<h2>Add client</h2><label>Client name</label><input id="c_n" placeholder="New client name">
 <label>Colour</label><div class="sw" id="sw">${PAL.map(c=>`<button data-c="${c}" style="--c:${c}" class="${c===cc?"on":""}" aria-label="${c}"></button>`).join("")}</div>
 <div class="acts"><span class="sp"></span><button class="btn" id="cx">Cancel</button><button class="btn pri" id="sv">Add client</button></div>`;
 $("sw").onclick=e=>{const b=e.target.closest("button");if(!b)return;cc=b.dataset.c;[...$("sw").children].forEach(x=>x.classList.toggle("on",x===b))};
 $("cx").onclick=close;
 $("sv").onclick=()=>{const n=$("c_n").value.trim();if(!n||C.some(c=>c.name.toLowerCase()===n.toLowerCase()))return $("c_n").focus();C.push({name:n,color:cc});flt=n;save();close();render()};
 $("ov").classList.add("show");$("c_n").focus();
}
const close=()=>$("ov").classList.remove("show");
$("ov").onclick=e=>{if(e.target.id==="ov")close()};
$("prev").onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);render()};
$("next").onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);render()};
$("tod").onclick=()=>{const n=new Date();view=new Date(n.getFullYear(),n.getMonth(),1);render()};
$("add").onclick=()=>openEd(null);
$("filters").onclick=e=>{if(e.target.closest("#addc"))return openClient();const b=e.target.closest(".fc");if(b){flt=b.dataset.c;render()}};
$("days").onclick=e=>{
 const a=e.target.closest("[data-adv]");
 if(a){e.stopPropagation();const p=P.find(x=>x.id===a.dataset.adv);p.status=ST[(ST.indexOf(p.status)+1)%ST.length];save();render();return}
 const c=e.target.closest(".chip");
 if(c)return openEd(c.dataset.id);
 const cell=e.target.closest(".cell");if(cell)openEd(null,cell.dataset.d);
};
$("tk").innerHTML=("<span>WHERE YOUR BRAND TAKES FLIGHT</span><b>✦</b><span>JOYIN HOUSE</span><b>✦</b><span>CONTENT CALENDAR</span><b>✦</b>").repeat(12);
render();
</script></body></html>
